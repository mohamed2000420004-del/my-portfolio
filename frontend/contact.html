<main class="container"><section><h2>Contact me</h2><p class="sub">Send a message — it's saved by the Node backend via <code>POST /api/contact</code>. Or reach me on GitHub.</p>

<span data-profile="availability">Available for work</span><br>
<a id="github-link" href="#" target="_blank" rel="noopener">GitHub ↗</a> · <a id="email-link" href="#">Email</a></div>

<footer><div class="container footer-in"><span>© <span data-profile="name">Mohamed</span></span><span>Messages are stored in backend/data/messages.json</span></div></footer>
